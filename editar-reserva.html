<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizonte Viajes | Editar Reserva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/config.js"></script>
</head>
<body class="overflow-x-hidden bg-section-soft font-sans text-slate-800">
    <div id="site-header"></div>

    <main class="mx-auto max-w-3xl px-4 pb-12 pt-36 lg:pt-44">
        <a href="reservas.html" class="link-back"><i class="bi bi-arrow-left"></i> Volver a solicitudes</a>

        <div class="mb-8">
            <span class="page-badge">Área operativa</span>
            <h1 class="page-title">Editar solicitud de reserva</h1>
            <p class="page-subtitle">Actualiza los datos de la reserva #<span id="reserva-id-label">—</span>.</p>
        </div>

        <div id="loading" class="loading-box">Cargando reserva...</div>

        <form id="form-editar" class="form-card hidden">
            <div class="form-card__bar"></div>
            <div class="form-card__body">
                <div class="form-card__header">
                    <div class="form-card__icon"><i class="bi bi-pencil-square"></i></div>
                    <div>
                        <h2 class="form-card__title">Datos del cliente y del viaje</h2>
                        <p class="form-card__subtitle">Modifica la información registrada por el visitante.</p>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-field">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required class="form-control">
                    </div>
                    <div class="form-field">
                        <label class="form-label" for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" required class="form-control">
                    </div>
                    <div class="form-field form-field--full">
                        <label class="form-label" for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" required class="form-control">
                    </div>
                    <div class="form-field">
                        <label class="form-label" for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" required class="form-control">
                    </div>
                    <div class="form-field form-field--full">
                        <label class="form-label" for="paquete">Paquete</label>
                        <select id="paquete" name="paquete" required class="hv-select">
                            <option value="caribe">Caribe Todo Incluido — desde $1.200 USD</option>
                            <option value="europa">Europa Clásica — desde $2.800 USD</option>
                            <option value="andes">Aventura en los Andes — desde $950 USD</option>
                            <option value="personalizado">Viaje personalizado — cotización a medida</option>
                        </select>
                        <p data-paquete-precio class="form-hint"><i class="bi bi-tag-fill"></i><span></span></p>
                    </div>
                    <div class="form-field">
                        <label class="form-label" for="salida">Fecha de salida</label>
                        <input type="date" id="salida" name="salida" required class="form-control form-control--date">
                    </div>
                    <div class="form-field">
                        <label class="form-label" for="regreso">Fecha de regreso</label>
                        <input type="date" id="regreso" name="regreso" required class="form-control form-control--date">
                    </div>
                    <div class="form-field form-field--full">
                        <label class="form-label" for="viajeros">Número de viajeros</label>
                        <select id="viajeros" name="viajeros" class="hv-select" data-placeholder="No indicado">
                            <option value="">No indicado</option>
                            <option value="1">1 persona</option>
                            <option value="2">2 personas</option>
                            <option value="3">3 personas</option>
                            <option value="4">4 personas</option>
                            <option value="5">5 personas</option>
                            <option value="6+">6 o más</option>
                        </select>
                    </div>
                    <div class="form-field form-field--full">
                        <label class="form-label" for="comentarios">Comentarios</label>
                        <textarea id="comentarios" name="comentarios" rows="3" class="form-control"></textarea>
                    </div>
                    <div class="form-field form-field--full form-actions">
                        <button type="submit" id="btn-actualizar" class="btn btn--primary"><i class="bi bi-check-lg"></i>Guardar cambios</button>
                        <a href="reservas.html" class="btn btn--ghost">Cancelar</a>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/layout.js"></script>
    <script src="js/dropdown.js"></script>
    <script src="js/ReservaService.js"></script>
    <script src="js/reserva-modal.js"></script>
    <script>
        mountLayout('inicio');
        setupReservaApp();

        const reservaId = getQueryParam('id');
        if (!reservaId) window.location.href = 'reservas.html';

        const reservaService = new ReservaService(getSupabaseClient());
        const loading = document.getElementById('loading');
        const form = document.getElementById('form-editar');
        const btnActualizar = document.getElementById('btn-actualizar');

        async function cargarReserva() {
            try {
                const r = await reservaService.obtener(reservaId);
                document.getElementById('reserva-id-label').textContent = r.id;
                document.getElementById('nombre').value = r.nombre;
                document.getElementById('apellido').value = r.apellido;
                document.getElementById('email').value = r.email;
                document.getElementById('telefono').value = r.telefono;
                document.getElementById('paquete').value = r.paquete;
                document.getElementById('salida').value = r.fecha_salida;
                document.getElementById('regreso').value = r.fecha_regreso;
                document.getElementById('viajeros').value = r.viajeros || '';
                document.getElementById('comentarios').value = r.comentarios || '';
                initCustomDropdowns(form);
                syncCustomDropdown(form.paquete);
                syncCustomDropdown(form.viajeros);
                initPaquetePrecio(form);
                loading.classList.add('hidden');
                form.classList.remove('hidden');
            } catch (err) {
                loading.classList.add('hidden');
                showToast(err.message || 'Reserva no encontrada.', 'error', { title: 'Error' });
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = leerDatosReserva(form);
            const errorFechas = validarFechasReserva(datos.fecha_salida, datos.fecha_regreso);
            if (errorFechas) {
                showToast(errorFechas, 'warning', { title: 'Revisa las fechas' });
                return;
            }

            btnActualizar.disabled = true;
            btnActualizar.innerHTML = '<i class="bi bi-hourglass-split"></i> Guardando...';

            try {
                await reservaService.modificar(reservaId, datos);
                showToast('Los cambios se guardaron correctamente.', 'success', { title: 'Reserva actualizada' });
                setTimeout(() => { window.location.href = 'reservas.html'; }, 1200);
            } catch (err) {
                showToast(err.message || 'No se pudo actualizar la reserva.', 'error', { title: 'Error al guardar' });
                btnActualizar.disabled = false;
                btnActualizar.innerHTML = '<i class="bi bi-check-lg"></i> Guardar cambios';
            }
        });

        cargarReserva();
    </script>
</body>
</html>
